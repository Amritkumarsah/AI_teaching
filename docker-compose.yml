version: '3.8'

services:
  # 1. Production MongoDB Database
  mongodb:
    image: mongo:7.0-jammy
    container_name: ai-teacher-db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123_change_in_prod
      MONGO_INITDB_DATABASE: ai_teacher
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ai-teacher-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Node Express API Server
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-teacher-api
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:password123_change_in_prod@mongodb:27017/ai_teacher?authSource=admin
      JWT_SECRET: super_secure_production_jwt_secret_change_me_immediately_2026
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - api_uploads:/app/apps/api/uploads
      - api_static:/app/apps/api/static
    networks:
      - ai-teacher-network

  # 3. Nginx Web SPA Frontend
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ai-teacher-web
    restart: always
    depends_on:
      - api
    ports:
      - "3000:80"
    networks:
      - ai-teacher-network

networks:
  ai-teacher-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  api_uploads:
    driver: local
  api_static:
    driver: local
